appId: com.nsn.bridge
productName: NSN Bridge
artifactName: NSN-Bridge-v${version}-mac-${arch}.${ext}
directories:
  app: apps/bridge
  output: apps/bridge/dist/release
  buildResources: apps/bridge/build
files:
  - dist/**
  - package.json
asarUnpack:
  - node_modules/@napi-rs/canvas*/**/*.node
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
dmg:
  sign: false
publish:
  provider: github
