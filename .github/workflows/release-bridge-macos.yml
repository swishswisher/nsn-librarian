name: Release NSN Bridge for macOS

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "bridge-v*"
  workflow_dispatch:
    inputs:
      development_build:
        description: "Create an unsigned development build"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      publish_release:
        description: "Publish the DMGs as a GitHub prerelease"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  quality:
    name: Test NSN web and Bridge
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nsn_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nsn_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/nsn_test?schema=public
      NEXT_PUBLIC_APP_URL: https://nsn-librarian.vercel.app
      NSN_LIBRARIAN_APP_URL: https://nsn-librarian.vercel.app
      AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-characters
      AUTH_GOOGLE_ID: ci-google-client-id.apps.googleusercontent.com
      AUTH_GOOGLE_SECRET: ci-google-client-secret
      NSN_AUTH_ALLOWED_USERS_JSON: '[{"email":"ci@example.com","googleSubject":"ci-google-subject","name":"CI User","role":"OWNER"}]'
      NSN_BRIDGE_COMMAND_SIGNING_SECRET: ci-command-signing-secret-with-at-least-32-characters
      NSN_BRIDGE_PAIRING_SECRET: ci-pairing-secret-with-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Prepare test database
        run: |
          npx prisma db push --skip-generate
          psql postgresql://postgres:postgres@127.0.0.1:5432/nsn_test \
            -f prisma/migrations/20260730170000_bridge_request_nonce/migration.sql

      - name: Lint
        run: npm run lint

      - name: Test human auth
        run: npm run test:auth

      - name: Test protocol
        run: npm run test:protocol

      - name: Test Bridge
        run: npm run test:bridge

      - name: Build web
        run: npm run build:web

      - name: Type-check Bridge
        run: npm run build:bridge

  build-macos:
    name: Build macOS Bridge (${{ matrix.architecture }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-26
          - architecture: x64
            runner: macos-26-intel
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nsn_build?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/nsn_build?schema=public
      NSN_BRIDGE_ARCH: ${{ matrix.architecture }}
      NSN_LIBRARIAN_APP_URL: ${{ vars.NSN_LIBRARIAN_APP_URL || 'https://nsn-librarian.vercel.app' }}
      TMPDIR: /private/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine build mode
        id: build_mode
        env:
          DEVELOPMENT_BUILD: ${{ inputs.development_build || 'true' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          unsigned=false

          if [ "$EVENT_NAME" = "pull_request" ]; then
            unsigned=true
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            unsigned=true
          elif [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == *dev* ]]; then
            unsigned=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DEVELOPMENT_BUILD" = "true" ]; then
            unsigned=true
          fi

          echo "unsigned=$unsigned" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type-check Bridge
        run: npm run build:bridge

      - name: Verify native PDF dependency
        shell: bash
        run: |
          set -euo pipefail

          if [ "$NSN_BRIDGE_ARCH" = "arm64" ]; then
            canvas_package="@napi-rs/canvas-darwin-arm64"
          else
            canvas_package="@napi-rs/canvas-darwin-x64"
          fi

          NSN_CANVAS_PACKAGE="$canvas_package" node -e "const pkg = process.env.NSN_CANVAS_PACKAGE; console.log(require.resolve(pkg));"

      - name: Prepare signing certificate
        if: ${{ steps.build_mode.outputs.unsigned == 'false' }}
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Signing credentials are required for production Bridge releases."
            exit 1
          fi
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" build.keychain

      - name: Package unsigned macOS DMG
        if: ${{ steps.build_mode.outputs.unsigned == 'true' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NSN_UNSIGNED_BUILD: "true"
        run: npm run package:bridge:mac

      - name: Package signed macOS DMG
        if: ${{ steps.build_mode.outputs.unsigned == 'false' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NSN_UNSIGNED_BUILD: "false"
        run: npm run package:bridge:mac

      - name: Verify architecture output
        shell: bash
        run: |
          set -euo pipefail

          cd apps/bridge/dist/release
          arch_count="$(find . -maxdepth 1 -type f -name "*mac-${NSN_BRIDGE_ARCH}*.dmg" | wc -l | tr -d ' ')"
          other_count="$(find . -maxdepth 1 -type f -name "*.dmg" ! -name "*mac-${NSN_BRIDGE_ARCH}*.dmg" | wc -l | tr -d ' ')"

          if [ "$arch_count" -ne 1 ] || [ "$other_count" -ne 0 ]; then
            echo "Expected exactly one ${NSN_BRIDGE_ARCH} DMG and no other architecture DMGs."
            find . -maxdepth 1 -type f -name "*.dmg" -print
            exit 1
          fi

      - name: Upload architecture DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsn-bridge-macos-${{ matrix.architecture }}-${{ steps.build_mode.outputs.unsigned == 'true' && 'unsigned' || 'signed' }}
          path: apps/bridge/dist/release/*mac-${{ matrix.architecture }}*.dmg
          if-no-files-found: error

  publish-macos:
    name: Publish macOS Bridge release
    needs: build-macos
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish_release == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release metadata
        id: release
        env:
          DEVELOPMENT_BUILD: ${{ inputs.development_build || 'true' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          unsigned=false

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            unsigned=true
          elif [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == *dev* ]]; then
            unsigned=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DEVELOPMENT_BUILD" = "true" ]; then
            unsigned=true
          fi

          if [ "$unsigned" = "true" ]; then
            echo "channel=unsigned" >> "$GITHUB_OUTPUT"
            echo "release_channel=development" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=signed" >> "$GITHUB_OUTPUT"
            echo "release_channel=production" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "master" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=bridge-v0.1.0-dev-${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=bridge-v0.1.0-dev-${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Apple Silicon artifact
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: nsn-bridge-macos-arm64-${{ steps.release.outputs.channel }}
          path: release-assets

      - name: Download Intel artifact
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: nsn-bridge-macos-x64-${{ steps.release.outputs.channel }}
          path: release-assets

      - name: Verify and prepare combined release assets
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          NSN_RELEASE_CHANNEL: ${{ steps.release.outputs.release_channel }}
          NSN_RELEASE_SIGNED: ${{ steps.release.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail

          cd release-assets
          arm64_count="$(find . -maxdepth 1 -type f -name "NSN-Bridge-v*-mac-arm64*.dmg" | wc -l | tr -d ' ')"
          x64_count="$(find . -maxdepth 1 -type f -name "NSN-Bridge-v*-mac-x64*.dmg" | wc -l | tr -d ' ')"

          if [ "$arm64_count" -ne 1 ] || [ "$x64_count" -ne 1 ]; then
            echo "Both Apple Silicon and Intel Mac DMGs are required before publishing."
            find . -maxdepth 1 -type f -print
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const files = fs
            .readdirSync(".")
            .filter((fileName) => fileName.endsWith(".dmg"))
            .sort((left, right) => {
              const leftRank = left.includes("mac-arm64") ? 0 : 1;
              const rightRank = right.includes("mac-arm64") ? 0 : 1;

              return leftRank - rightRank || left.localeCompare(right);
            });

          fs.writeFileSync(
            "latest-mac.json",
            `${JSON.stringify(
              {
                channel: process.env.NSN_RELEASE_CHANNEL,
                files,
                generatedAt: new Date().toISOString(),
                signed: process.env.NSN_RELEASE_SIGNED === "true",
              },
              null,
              2,
            )}\n`,
            "utf8",
          );
          NODE

          shasum -a 256 *.dmg latest-mac.json > SHA256SUMS.txt

      - name: Upload release assets
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: NSN Bridge ${{ steps.release.outputs.tag }}
          body: |
            Unsigned internal NSN Bridge build for Deanne's MacBook.

            macOS may require manual approval through System Settings -> Privacy & Security -> Open Anyway.

            Nothing moves without an approved Organization Plan and typed EXECUTE confirmation. Undo requires typed UNDO confirmation.
          fail_on_unmatched_files: true
          prerelease: ${{ steps.release.outputs.signed != 'true' }}
          files: |
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
            release-assets/latest-mac.json
