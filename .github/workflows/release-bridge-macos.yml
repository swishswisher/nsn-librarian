name: Release NSN Bridge for macOS

on:
  pull_request:
    branches:
      - master
  push:
    tags:
      - "bridge-v*"
  workflow_dispatch:
    inputs:
      development_build:
        description: "Create an unsigned development build"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      publish_release:
        description: "Publish the DMGs as a GitHub prerelease"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  quality:
    name: Test NSN web and Bridge
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nsn_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nsn_test?schema=public
      NEXT_PUBLIC_APP_URL: https://nsn-librarian.vercel.app
      NSN_LIBRARIAN_APP_URL: https://nsn-librarian.vercel.app
      NSN_BRIDGE_COMMAND_SIGNING_SECRET: ci-command-signing-secret-with-at-least-32-characters
      NSN_BRIDGE_PAIRING_SECRET: ci-pairing-secret-with-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Prepare test database
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Test protocol
        run: npm run test:protocol

      - name: Test Bridge
        run: npm run test:bridge

      - name: Build web
        run: npm run build:web

      - name: Type-check Bridge
        run: npm run build:bridge

  build-macos:
    name: Build macOS Bridge
    needs: quality
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      NSN_LIBRARIAN_APP_URL: ${{ vars.NSN_LIBRARIAN_APP_URL || 'https://nsn-librarian.vercel.app' }}
      NSN_UNSIGNED_BUILD: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.development_build == 'true') || (github.event_name == 'push' && contains(github.ref_name, 'dev')) }}
      TMPDIR: /private/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type-check Bridge
        run: npm run build:bridge

      - name: Prepare signing certificate
        if: ${{ env.NSN_UNSIGNED_BUILD != 'true' }}
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Signing credentials are required for production Bridge releases."
            exit 1
          fi
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" build.keychain

      - name: Package unsigned macOS DMGs
        if: ${{ env.NSN_UNSIGNED_BUILD == 'true' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NSN_UNSIGNED_BUILD: "true"
        run: npm run package:bridge:mac

      - name: Package signed macOS DMGs
        if: ${{ env.NSN_UNSIGNED_BUILD != 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NSN_UNSIGNED_BUILD: "false"
        run: npm run package:bridge:mac

      - name: Calculate checksums
        run: |
          cd apps/bridge/dist/release
          shasum -a 256 *.dmg > SHA256SUMS.txt
          shasum -a 256 latest-mac.json >> SHA256SUMS.txt

      - name: Upload build artifacts
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: nsn-bridge-macos-${{ env.NSN_UNSIGNED_BUILD == 'true' && 'unsigned' || 'signed' }}
          path: |
            apps/bridge/dist/release/*.dmg
            apps/bridge/dist/release/SHA256SUMS.txt
            apps/bridge/dist/release/latest-mac.json
          if-no-files-found: error

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=bridge-v0.1.0-dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: NSN Bridge ${{ steps.release.outputs.tag }}
          body: |
            Unsigned internal NSN Bridge build for Deanne's MacBook.

            macOS may require manual approval through System Settings → Privacy & Security → Open Anyway.

            Nothing moves without an approved Organization Plan and typed EXECUTE confirmation.
          fail_on_unmatched_files: true
          prerelease: ${{ env.NSN_UNSIGNED_BUILD == 'true' }}
          files: |
            apps/bridge/dist/release/*.dmg
            apps/bridge/dist/release/SHA256SUMS.txt
            apps/bridge/dist/release/latest-mac.json
